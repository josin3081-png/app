{% extends "base.html" %}
{% block title %}Edit profile · Spark{% endblock %}
{% block main_class %}auth-main{% endblock %}
{% block content %}
<form class="card form" method="post" enctype="multipart/form-data">
  <h1>Edit profile</h1>
  <label>Photo
    <input type="file" name="photo" accept="image/*">
  </label>
  <label>Name
    <input type="text" name="name" required maxlength="80" value="{{ user.name }}">
  </label>
  <div class="row">
    <label>Age
      <input type="number" name="age" min="18" max="120" value="{{ user.age or '' }}">
    </label>
    <label>City
      <input type="text" name="city" maxlength="80" value="{{ user.city or '' }}">
    </label>
  </div>
  <div class="row">
    <label>I am
      <select name="gender">
        {% for option in ["Woman", "Man", "Non-binary", "Prefer not to say"] %}
        <option {% if user.gender == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Looking for
      <select name="looking_for">
        {% for option in ["Everyone", "Women", "Men"] %}
        <option {% if user.looking_for == option %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
    </label>
  </div>
  <label>Bio
    <textarea name="bio" rows="4" maxlength="400">{{ user.bio or "" }}</textarea>
  </label>
  <label>Interests
    <input type="text" name="interests" value="{{ user.interests or "" }}" placeholder="Coffee, hiking, films">
  </label>
  <button class="btn primary" type="submit">Save</button>
</form>
{% endblock %}
