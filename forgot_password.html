{% extends "base.html" %}
{% block title %}Reset password · Spark{% endblock %}
{% block main_class %}auth-main{% endblock %}
{% block content %}
<form class="card form" method="post">
  <h1>Reset password</h1>
  <p>Enter your email and choose a new password.</p>
  <label>Email
    <input type="email" name="email" value="{{ email or '' }}" required placeholder="you@example.com">
  </label>
  <label>New password
    <input type="password" name="password" minlength="6" required placeholder="••••••••">
  </label>
  <label>Confirm password
    <input type="password" name="confirm_password" minlength="6" required placeholder="••••••••">
  </label>
  <button class="btn primary" type="submit">Reset password</button>
  <p><a href="{{ url_for('login') }}">Back to sign in</a></p>
</form>
{% endblock %}
